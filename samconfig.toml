version = 0.1

[default.global.parameters]
stack_name = "url-shortener"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
# Stack parameters resolve from SSM (/url-shortener/*) via their Default in
# template.yaml — no parameter_overrides needed.
