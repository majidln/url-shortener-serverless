AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  url-shortener

  Sample SAM Template for url-shortener

Parameters:
  StageName:
    Type: String
    Default: Dev

  # Everything below resolves from SSM Parameter Store at deploy time. The
  # values live under /url-shortener/* in the account, not in this repo. Create
  # them with `aws ssm put-parameter` before deploying.
  DomainName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /url-shortener/domain-name
    Description: Hostname the redirect service answers on
  HostedZoneId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /url-shortener/hosted-zone-id
    Description: Route 53 zone that owns DomainName
  NotificationEmail:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /url-shortener/notification-email
    Description: Backup address for CloudWatch alarm notifications
  SlackWorkspaceId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /url-shortener/slack-workspace-id
    Description: AWS Chatbot-authorized Slack workspace id
  SlackChannelId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /url-shortener/slack-channel-id
    Description: Slack channel id for alarm notifications
  EnableWaf:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Attach the WAF Web ACL to the CloudFront distribution.
  WafAllowedIps:
    Type: AWS::SSM::Parameter::Value<List<String>>
    Default: /url-shortener/waf-allowed-ips
    Description: CIDR ranges exempted from the /shorten rate limit (comma-separated in SSM)

Conditions:
  WafOn: !Equals [!Ref EnableWaf, "true"]

Globals:
  Function:
    Timeout: 5

Resources:
  KeyGeneratorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/key-generator/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      LoggingConfig:
        LogGroup: !Ref KeyGeneratorLogGroup
  UrlShortenerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/url-shortener/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      LoggingConfig:
        LogGroup: !Ref ShortenerLogGroup
      Environment:
        Variables:
          KEY_GENERATOR_FUNCTION_ARN: !GetAtt KeyGeneratorFunction.Arn
          URL_TABLE_NAME: !Ref UrlTable
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref KeyGeneratorFunction
        - DynamoDBWritePolicy:
            TableName: !Ref UrlTable
      Events:
        UrlShortener:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /shorten
  UrlRedirectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/url-redirect/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      LoggingConfig:
        LogGroup: !Ref RedirectLogGroup
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Environment:
        Variables:
          URL_TABLE_NAME: !Ref UrlTable
          CACHE_TTL_SECONDS: "60"
          CACHE_MAX_ENTRIES: "5000"
          # L2: read at cold start. If the cache stack isn't deployed this
          # parameter won't exist and the handler runs on L1 + DynamoDB.
          CACHE_ENDPOINT_PARAM: /url-shortener/cache/endpoint
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UrlTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/url-shortener/cache/*"
      Events:
        UrlRedirect:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /{key}
      AutoPublishAlias: live
      DeploymentPreference:
        Type: Canary10Percent5Minutes
        Alarms:
          # Http5xxRateAlarm referenced by name, not !Ref: it depends on HttpApi,
          # HttpApi depends on this function's alias, the alias depends on this
          # deployment group — !Ref here would close that loop (E3004). CanaryAlarm
          # has no such dependency, so !Ref is fine and guarantees ordering.
          - !Sub "${AWS::StackName}-http-5xx-rate"
          - !Ref CanaryAlarm

  CanaryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/canary/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      Timeout: 15
      LoggingConfig:
        LogGroup: !Ref CanaryLogGroup
      Environment:
        Variables:
          PROBE_BASE_URL: !Sub "https://${DomainName}"
      Policies:
        - Statement:
            - Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: UrlShortener/Canary
      Events:
        Tick:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)


  # Declared so retention is bounded and the groups die with the stack, instead
  # of Lambda auto-creating them as never-expire and orphaning them on delete.
  KeyGeneratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-key-generator"
      RetentionInDays: 14
  ShortenerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-url-shortener"
      RetentionInDays: 14
  RedirectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-url-redirect"
      RetentionInDays: 14
  CanaryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-canary"
      RetentionInDays: 14

  # Turn the redirect handler's `cache` log field (l1 | l2 | miss) into
  # metrics, no API call on the hot path.
  #   overall hit rate = (CacheL1 + CacheL2) / (CacheL1 + CacheL2 + CacheOrigin)
  RedirectCacheL1Filter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref RedirectLogGroup
      FilterPattern: '{ $.cache = "l1" }'
      MetricTransformations:
        - MetricNamespace: UrlShortener/Redirect
          MetricName: CacheL1
          MetricValue: "1"
          DefaultValue: 0
  RedirectCacheL2Filter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref RedirectLogGroup
      FilterPattern: '{ $.cache = "l2" }'
      MetricTransformations:
        - MetricNamespace: UrlShortener/Redirect
          MetricName: CacheL2
          MetricValue: "1"
          DefaultValue: 0
  RedirectCacheOriginFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref RedirectLogGroup
      FilterPattern: '{ $.cache = "miss" }'
      MetricTransformations:
        - MetricNamespace: UrlShortener/Redirect
          MetricName: CacheOrigin
          MetricValue: "1"
          DefaultValue: 0

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
  # Cache key is the path only (no query strings/headers/cookies) and
  # TTLs are 0/0/3600 so CloudFront trusts the origin's Cache-Control instead
  # of a managed policy's own default (CachingOptimized silently caches a day
  # when the origin sends nothing — wrong for a service that must be able to
  # kill a link).
  RedirectCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-redirect"
        Comment: Cache key is the request path only; TTL comes from the origin's Cache-Control.
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 3600
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true

  # Aliases/ViewerCertificate added per §4 step 2. DNS (the HttpApi Domain
  # block, below) still points link123.cfd at API Gateway directly, so this
  # deploy changes nothing for live traffic — it only makes the distribution
  # *able* to answer for link123.cfd, ahead of the DNS cutover in §4 steps 3-4.
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} redirect edge"
        # §6: WebACLAssociation doesn't work for CloudFront (regional
        # resources only) - a CloudFront-scoped ACL is attached here directly.
        WebACLId: !If [WafOn, !GetAtt WebAcl.Arn, !Ref AWS::NoValue]
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: HttpApiOrigin
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            # Stage is Dev, not $default - without this every request 404s at
            # API Gateway before it ever reaches the Lambda.
            OriginPath: !Sub "/${StageName}"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: HttpApiOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: !Ref RedirectCachePolicy
          # AllViewerExceptHostHeader (managed). Forwarding the viewer's literal
          # Host: link123.cfd straight to execute-api makes API Gateway 403 -
          # it only routes requests addressed to itself.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        CacheBehaviors:
          - PathPattern: /shorten
            TargetOriginId: HttpApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            # CloudFront only offers three method sets; POST forces "all seven".
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            # CachingDisabled (managed) - always pass through, never cached.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        CustomErrorResponses:
          # CloudFront's own default is 10s for these; a stuck origin blip
          # shouldn't stay pinned at the edge after it recovers.
          - ErrorCode: 500
            ErrorCachingMinTTL: 0
          - ErrorCode: 502
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ErrorCachingMinTTL: 0
          - ErrorCode: 504
            ErrorCachingMinTTL: 0

  # Content comes from SSM (WafAllowedIps), never hardcoded here - update
  # the SSM StringList and redeploy to add/remove an address.
  WafAllowedIpSet:
    Type: AWS::WAFv2::IPSet
    Condition: WafOn
    Properties:
      Name: !Sub "${AWS::StackName}-waf-allowed-ips"
      Scope: CLOUDFRONT
      IPAddressVersion: IPV4
      Addresses: !Ref WafAllowedIps

  # Scope: CLOUDFRONT requires us-east-1 - already true here.
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: WafOn
    Properties:
      Name: !Sub "${AWS::StackName}-edge"
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AWS::StackName}-edge"
      Rules:
        - Name: AllowListedIps
          Priority: 0
          Action:
            Allow: {}
          Statement:
            IPSetReferenceStatement:
              Arn: !GetAtt WafAllowedIpSet.Arn
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-allow-listed-ips"
        - Name: AmazonIpReputationList
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-ip-reputation"
        - Name: KnownBadInputs
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-known-bad-inputs"
        - Name: RateLimitShorten
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 100
              AggregateKeyType: IP
              ScopeDownStatement:
                AndStatement:
                  Statements:
                    - ByteMatchStatement:
                        SearchString: /shorten
                        FieldToMatch:
                          UriPath: {}
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
                        PositionalConstraint: EXACTLY
                    - ByteMatchStatement:
                        SearchString: POST
                        FieldToMatch:
                          Method: {}
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
                        PositionalConstraint: EXACTLY
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-rate-limit-shorten"

  RedirectDnsRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false
  RedirectDnsRecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  UrlTable:
    Type: AWS::Serverless::SimpleTable
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PrimaryKey:
        Name: key
        Type: String

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-vpc" }

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/20
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-private-a" }
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.16.0/20
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-private-b" }

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-private-rt" }

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  DynamoDBEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: url-redirect Lambda ENIs
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-lambda-sg" }

  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ElastiCache Valkey
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-cache-sg" }

  # DynamoDB gets a free Gateway endpoint (above). Every other AWS service the
  # VPC'd redirect Lambda calls needs a paid Interface endpoint (PrivateLink):
  # an ENI with a private IP, reached over HTTPS. Right now that's just SSM,
  # which the handler reads at cold start for the cache endpoint.
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: VPC interface endpoints - HTTPS from the Lambda SG only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-endpoints-sg" }

  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
      VpcEndpointType: Interface
      SubnetIds:
        # One ENI per AZ the Lambda runs in. With only subnet A, ~1/3 of cold
        # starts (the ones whose ENI landed in subnet B) still couldn't reach
        # SSM and fell back to L1 + DynamoDB. ~$14/mo for the pair.
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      # Makes ssm.<region>.amazonaws.com resolve to this endpoint's private IP
      # inside the VPC, so the AWS SDK needs no change.
      PrivateDnsEnabled: true

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alarms"

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  ChatbotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: chatbot.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess

  SlackAlarmChannel:
    Type: AWS::Chatbot::SlackChannelConfiguration
    Properties:
      ConfigurationName: !Sub "${AWS::StackName}-alarms"
      IamRoleArn: !GetAtt ChatbotRole.Arn
      SlackWorkspaceId: !Ref SlackWorkspaceId
      SlackChannelId: !Ref SlackChannelId
      SnsTopicArns:
        - !Ref AlarmTopic

  Http5xxRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-http-5xx-rate"
      AlarmDescription: >-
        HTTP API 5xx rate over 5% for 3 of 5 minutes. Pages on the front door,
        not on Lambda Errors (a 500 the handler returns cleanly is a successful
        invocation). Floored: ignored below 10 req/min — the canary covers the
        zero-traffic case.
      Metrics:
        - Id: err
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: 5xx
              Dimensions:
                - Name: ApiId
                  Value: !Ref HttpApi
            Period: 60
            Stat: Sum
        - Id: total
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: Count
              Dimensions:
                - Name: ApiId
                  Value: !Ref HttpApi
            Period: 60
            Stat: Sum
        - Id: rate
          Expression: "IF(total >= 10, 100 * err / total, 0)"
          Label: 5xx % of requests
          ReturnData: true
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  # Zero-traffic watchdog and the deploy gate. Missing data = breaching: a
  # canary that goes silent is itself a failure.
  CanaryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-canary-redirect"
      AlarmDescription: >-
        Synthetic create+redirect probe failed 3 of the last 5 minutes. Works
        with zero organic traffic.
      Namespace: UrlShortener/Canary
      MetricName: Success
      Dimensions:
        - Name: Probe
          Value: redirect
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  # The front door moved to CloudFront, which now absorbs most traffic -
  # Http5xxRateAlarm above only sees edge misses. This catches failures (cert,
  # cache behavior, origin unreachable, a WAF misfire once §6 adds it) that
  # never reach API Gateway at all. 5xxErrorRate is a free metric already
  # expressed as a percentage, but only published at 5-minute granularity
  # without CloudFront's paid "additional metrics" - reacts slower than
  # Http5xxRateAlarm by design, not an oversight.
  CloudFront5xxRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-cloudfront-5xx-rate"
      AlarmDescription: >-
        CloudFront edge 5xx rate over 5% for 2 of 3 five-minute periods.
      Namespace: AWS/CloudFront
      MetricName: 5xxErrorRate
      Dimensions:
        - Name: DistributionId
          Value: !Ref CloudFrontDistribution
        - Name: Region
          Value: Global
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref AWS::StackName
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "CloudFront - edge traffic & error rate %",
                "region": "us-east-1", "period": 300,
                "metrics": [
                  [ "AWS/CloudFront", "Requests", "DistributionId", "${CloudFrontDistribution}", "Region", "Global", { "stat": "Sum", "yAxis": "left", "label": "Requests" } ],
                  [ "AWS/CloudFront", "4xxErrorRate", "DistributionId", "${CloudFrontDistribution}", "Region", "Global", { "stat": "Average", "yAxis": "right", "label": "4xx %" } ],
                  [ "AWS/CloudFront", "5xxErrorRate", "DistributionId", "${CloudFrontDistribution}", "Region", "Global", { "stat": "Average", "yAxis": "right", "label": "5xx %" } ]
                ],
                "yAxis": { "right": { "min": 0 } },
                "annotations": { "horizontal": [ { "label": "alarm at 5%", "value": 5, "yAxis": "right" } ] }
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "HTTP API - 5xx rate %",
                "region": "${AWS::Region}", "period": 60,
                "metrics": [
                  [ "AWS/ApiGateway", "5xx", "ApiId", "${HttpApi}", { "id": "m5xx", "stat": "Sum", "visible": false } ],
                  [ "AWS/ApiGateway", "Count", "ApiId", "${HttpApi}", { "id": "mc", "stat": "Sum", "visible": false } ],
                  [ { "expression": "IF(mc >= 10, 100*m5xx/mc, 0)", "label": "5xx %", "id": "e1" } ]
                ],
                "yAxis": { "left": { "min": 0 } },
                "annotations": { "horizontal": [ { "label": "alarm at 5%", "value": 5 } ] }
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "HTTP API - latency (ms)",
                "region": "${AWS::Region}", "period": 60,
                "metrics": [
                  [ "AWS/ApiGateway", "Latency", "ApiId", "${HttpApi}", { "stat": "p50", "label": "Latency p50" } ],
                  [ "AWS/ApiGateway", "Latency", "ApiId", "${HttpApi}", { "stat": "p99", "label": "Latency p99" } ],
                  [ "AWS/ApiGateway", "IntegrationLatency", "ApiId", "${HttpApi}", { "stat": "p99", "label": "Integration p99" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda - errors & throttles",
                "region": "${AWS::Region}", "period": 60, "stat": "Sum",
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${UrlRedirectFunction}", { "label": "redirect errors" } ],
                  [ "AWS/Lambda", "Errors", "FunctionName", "${UrlShortenerFunction}", { "label": "shortener errors" } ],
                  [ "AWS/Lambda", "Errors", "FunctionName", "${KeyGeneratorFunction}", { "label": "key-generator errors" } ],
                  [ "AWS/Lambda", "Errors", "FunctionName", "${CanaryFunction}", { "label": "canary errors" } ],
                  [ "AWS/Lambda", "Throttles", "FunctionName", "${UrlRedirectFunction}", { "label": "redirect throttles" } ],
                  [ "AWS/Lambda", "Throttles", "FunctionName", "${UrlShortenerFunction}", { "label": "shortener throttles" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda - duration p99 (ms)",
                "region": "${AWS::Region}", "period": 60, "stat": "p99",
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "${UrlRedirectFunction}", { "label": "redirect" } ],
                  [ "AWS/Lambda", "Duration", "FunctionName", "${UrlShortenerFunction}", { "label": "shortener" } ],
                  [ "AWS/Lambda", "Duration", "FunctionName", "${KeyGeneratorFunction}", { "label": "key-generator" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB - capacity & throttles",
                "region": "${AWS::Region}", "period": 60, "stat": "Sum",
                "metrics": [
                  [ "AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${UrlTable}" ],
                  [ "AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${UrlTable}" ],
                  [ "AWS/DynamoDB", "ThrottledRequests", "TableName", "${UrlTable}" ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 18, "width": 8, "height": 6,
              "properties": {
                "title": "Canary - redirect probe (1 = pass)",
                "region": "${AWS::Region}", "period": 60, "stat": "Minimum",
                "metrics": [
                  [ "UrlShortener/Canary", "Success", "Probe", "redirect" ]
                ],
                "yAxis": { "left": { "min": 0, "max": 1 } }
              }
            },
            {
              "type": "alarm", "x": 8, "y": 18, "width": 16, "height": 6,
              "properties": {
                "title": "Alarms",
                "alarms": [ "${Http5xxRateAlarm.Arn}", "${CanaryAlarm.Arn}", "${CloudFront5xxRateAlarm.Arn}" ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 24, "width": 12, "height": 6,
              "properties": {
                "title": "Redirect - cache tier mix %",
                "region": "${AWS::Region}", "period": 300, "stat": "Sum",
                "metrics": [
                  [ "UrlShortener/Redirect", "CacheL1", { "id": "l1", "visible": false } ],
                  [ "UrlShortener/Redirect", "CacheL2", { "id": "l2", "visible": false } ],
                  [ "UrlShortener/Redirect", "CacheOrigin", { "id": "o", "visible": false } ],
                  [ { "expression": "100*l1/(l1+l2+o)", "label": "L1 %", "id": "e1" } ],
                  [ { "expression": "100*l2/(l1+l2+o)", "label": "L2 %", "id": "e2" } ],
                  [ { "expression": "100*o/(l1+l2+o)", "label": "origin %", "id": "e3" } ]
                ],
                "yAxis": { "left": { "min": 0, "max": 100 } }
              }
            }
          ]
        }



Outputs:
  CustomDomainUrl:
    Description: "HTTPS URL for the redirect service on the custom domain"
    Value: !Sub "https://${DomainName}/"
  CloudFrontDomainName:
    Description: "CloudFront's own domain - test through this before the DNS move (§4)"
    Value: !GetAtt CloudFrontDistribution.DomainName
  UrlShortenerApi:
    Description: "API Gateway endpoint URL for Prod stage for Url Shortener function"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/"
  KeyGeneratorFunction:
    Description: "Key Generator Lambda Function ARN"
    Value: !GetAtt KeyGeneratorFunction.Arn
  UrlShortenerFunction:
    Description: "Url Shortener Lambda Function ARN"
    Value: !GetAtt UrlShortenerFunction.Arn
  KeyRedirectFunction:
    Description: "Key Redirect Lambda Function ARN"
    Value: !GetAtt UrlRedirectFunction.Arn
  UrlTable:
    Description: "DynamoDB Table Name"
    Value: !Ref UrlTable
  AlarmTopicArn:
    Description: "SNS topic every alarm publishes to (fans out to Slack + backup email)"
    Value: !Ref AlarmTopic
  DashboardUrl:
    Description: "CloudWatch dashboard — the diagnosis surface"
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${AWS::StackName}"
  Http5xxAlarmName:
    Description: "Origin-level alarm (HTTP API 5xx rate, edge-miss traffic only); also gates redirect deploys"
    Value: !Ref Http5xxRateAlarm
  CloudFrontAlarmName:
    Description: "Front-door paging alarm (CloudFront edge 5xx rate) - §7, the front door moved here"
    Value: !Ref CloudFront5xxRateAlarm
  CanaryAlarmName:
    Description: "Synthetic canary watchdog; also gates redirect deploys"
    Value: !Ref CanaryAlarm
  CanaryFunctionName:
    Description: "Scheduled canary function (probes the public URL every minute)"
    Value: !Ref CanaryFunction
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "${AWS::StackName}-vpc-id" }
  PrivateSubnetIds:
    Description: "Comma-separated, for VpcConfig and the ElastiCache subnet group"
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
    Export: { Name: !Sub "${AWS::StackName}-private-subnet-ids" }
  LambdaSecurityGroupId:
    Value: !Ref LambdaSecurityGroup
    Export: { Name: !Sub "${AWS::StackName}-lambda-sg-id" }
  CacheSecurityGroupId:
    Value: !Ref CacheSecurityGroup
    Export: { Name: !Sub "${AWS::StackName}-cache-sg-id" }
