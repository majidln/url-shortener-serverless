AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  url-shortener
  
  Sample SAM Template for url-shortener

Parameters:
  StageName:
    Type: String
    Default: Dev
  DomainName:
    Type: String
    Description: Hostname the redirect service answers on, e.g. tinyurl.com
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 zone that owns DomainName

Globals:
  Function:
    Timeout: 5

Resources:
  KeyGeneratorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/key-generator/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
  UrlShortenerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/url-shortener/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Environment:
        Variables:
          KEY_GENERATOR_FUNCTION_ARN: !GetAtt  KeyGeneratorFunction.Arn
          URL_TABLE_NAME: !Ref UrlTable
      Policies: 
        - LambdaInvokePolicy:
            FunctionName: !Ref KeyGeneratorFunction
        - DynamoDBWritePolicy:
            TableName: !Ref UrlTable
      Events:
        UrlShortener:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /shorten
  UrlRedirectFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/url-redirect/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Environment:
        Variables:
          URL_TABLE_NAME: !Ref UrlTable
      Policies: 
        - DynamoDBReadPolicy:
            TableName: !Ref UrlTable
      Events:
        UrlRedirect:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /{key}
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      Domain:
        DomainName: !Ref DomainName
        CertificateArn: !Ref Certificate
        SecurityPolicy: TLS_1_2
        Route53:
          HostedZoneId: !Ref HostedZoneId
  UrlTable:
    Type: AWS::Serverless::SimpleTable
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PrimaryKey:
        Name: key
        Type: String

Outputs:
  CustomDomainUrl:
    Description: "HTTPS URL for the redirect service on the custom domain"
    Value: !Sub "https://${DomainName}/"
  UrlShortenerApi:
    Description: "API Gateway endpoint URL for Prod stage for Url Shortener function"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/"
  KeyGeneratorFunction:
    Description: "Key Generator Lambda Function ARN"
    Value: !GetAtt KeyGeneratorFunction.Arn
  UrlShortenerFunction:
    Description: "Url Shortener Lambda Function ARN"
    Value: !GetAtt UrlShortenerFunction.Arn
  KeyRedirectFunction:
    Description: "Key Redirect Lambda Function ARN"
    Value: !GetAtt UrlRedirectFunction.Arn
  UrlTable:
    Description: "DynamoDB Table Name"
    Value: !Ref UrlTable
